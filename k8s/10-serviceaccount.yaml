# Rendered by scripts/deploy.ps1, which fills the IDENTITY_CLIENT_ID placeholder below with the managed
# identity's client ID (a public identifier, not a secret). The single service account the pod runs as; the identity's federated
# credential trusts exactly system:serviceaccount:poc:ehpoc (see infra/modules/identity.bicep).
# The workload identity webhook derives AZURE_TENANT_ID from the cluster, so no tenant-id annotation is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ehpoc
  namespace: poc
  annotations:
    azure.workload.identity/client-id: "${IDENTITY_CLIENT_ID}"
